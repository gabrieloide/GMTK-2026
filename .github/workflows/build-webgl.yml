name: Build and Deploy WebGL

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-webgl-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-webgl-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.4f1
          targetPlatform: WebGL

      - name: Prepare build for GitHub Pages and Itch.io
        run: |
          sudo apt-get update && sudo apt-get install -y brotli
          sudo chown -R $USER:$USER build/
          if [ -d "build/WebGL/WebGL/Build" ]; then
            cd build/WebGL/WebGL
            for f in Build/*.br; do
              [ -e "$f" ] || continue
              brotli -d "$f"
              rm "$f"
            done
            sed -i 's/\.br//g' index.html
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/WebGL/WebGL

      - name: Deploy to Itch.io with Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d bin/
          chmod +x bin/butler
          ./bin/butler push build/WebGL/WebGL virterex/fast-car:html5 --userversion ${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL/WebGL
